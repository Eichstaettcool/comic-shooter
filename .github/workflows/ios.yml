name: iOS Build (unsigned IPA)

# Baut aus dem Godot-Projekt eine unsignierte .ipa auf einem macOS-Runner.
# Signiert wird danach auf Windows mit Sideloadly + eigener Apple-ID.
# Start: Actions -> "iOS Build (unsigned IPA)" -> Run workflow

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Godot 4.7.2 + Export-Templates installieren
        env:
          GODOT_VERSION: "4.7.2-stable"
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fL --retry 3 -o godot.zip "${base}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          sudo mv Godot.app /Applications/
          curl -fL --retry 3 -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q templates.tpz
          rm -rf "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mv templates "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          /Applications/Godot.app/Contents/MacOS/Godot --version

      - name: iOS-Projekt exportieren (Xcode-Projekt + .pck)
        run: |
          set -euo pipefail
          mkdir -p build
          /Applications/Godot.app/Contents/MacOS/Godot \
            --headless --path project \
            --export-release "iOS" "$GITHUB_WORKSPACE/build/ios" 2>&1 | tee export.log
          ls -la build
          # Beleg: .pck und xcframework muessen beim Projekt liegen
          test -f build/ios.pck

      - name: Xcode-Targets anzeigen (Diagnose)
        run: |
          cd build
          xcodebuild -list -project ios.xcodeproj || true

      - name: Bauen ohne Signatur (iphoneos, Release)
        run: |
          set -euo pipefail
          cd build
          TARGET="$(xcodebuild -list -project ios.xcodeproj 2>/dev/null | awk '/Targets:/{flag=1;next}/^$/{flag=0}flag{print $1; exit}')"
          if [ -z "$TARGET" ]; then TARGET="ios"; fi
          echo "Target: $TARGET"
          xcodebuild -project ios.xcodeproj -target "$TARGET" -configuration Release \
            -sdk iphoneos -derivedDataPath out \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee ../xcodebuild.log | tail -40

      - name: Unsigned IPA packen
        run: |
          set -euo pipefail
          APP="$(find build/out/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          NAME="ComicShooter-v1.51-unsigned.ipa"
          zip -qry "$NAME" Payload
          ls -la "$NAME"

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ComicShooter-unsigned-ipa
          path: ComicShooter-v1.51-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
